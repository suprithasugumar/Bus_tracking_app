name: bus_tracking_app
description: "Smart Bus Tracking App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.9

  # Maps and Location
  google_maps_flutter: ^2.6.0
  geolocator: ^12.0.0

  # Notifications
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true